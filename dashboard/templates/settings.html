<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Bot Settings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: { 800: '#1e1e2e', 900: '#11111b', 700: '#313244', 600: '#45475a' },
                        profit: '#a6e3a1',
                        loss: '#f38ba8',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-dark-900 text-gray-200 min-h-screen p-6 font-sans">
    
    <div class="max-w-7xl mx-auto space-y-6">
        <!-- Header -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-dark-800 p-6 rounded-xl border border-dark-700 shadow-lg">
            <div>
                <h1 class="text-3xl font-bold text-white flex items-center gap-3">
                    <svg class="w-8 h-8 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    Strategy Settings
                </h1>
                <p class="text-gray-400 mt-1">Dynamically tune the algorithm parameters without restarting the bot.</p>
            </div>
            <div class="flex flex-wrap gap-3">
                <nav class="flex rounded-lg overflow-hidden border border-dark-600">
                    <a href="/" class="px-4 py-2.5 bg-dark-700 hover:bg-dark-600">Dashboard</a>
                    <a href="/settings" class="px-4 py-2.5 bg-blue-600 font-semibold">Settings</a>
                    <a href="/experiments" class="px-4 py-2.5 bg-dark-700 hover:bg-dark-600">Learn & Test</a>
                </nav>
                <button onclick="saveSettings()" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-500 text-white rounded-lg transition-all font-semibold shadow-sm flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
                    Save & Apply
                </button>
            </div>
        </div>

        <div id="statusAlert" class="hidden p-4 rounded-lg font-medium text-center"></div>

        <div class="bg-dark-800 rounded-xl border border-dark-700 p-6">
            <h2 class="text-xl font-semibold text-white mb-4">Saved Profiles</h2>
            <div class="flex flex-col md:flex-row gap-3">
                <input id="profileName" placeholder="Profile name" class="flex-1 bg-dark-900 border border-dark-600 rounded-lg px-4 py-2.5">
                <button type="button" onclick="saveProfile()" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-500 rounded-lg font-semibold">Save Current Profile</button>
                <select id="profiles" class="flex-1 bg-dark-900 border border-dark-600 rounded-lg px-4 py-2.5"><option value="">Choose profile</option></select>
                <button type="button" onclick="applyProfile()" class="px-5 py-2.5 bg-purple-600 hover:bg-purple-500 rounded-lg font-semibold">Apply</button>
                <button type="button" onclick="deleteProfile()" class="px-5 py-2.5 bg-red-700 hover:bg-red-600 rounded-lg font-semibold">Delete</button>
            </div>
        </div>

        <form id="settingsForm" class="space-y-6">
            {% for group in groups %}
            <section class="bg-dark-800 rounded-xl border border-dark-700 shadow-lg p-6">
                <h2 class="text-xl font-semibold text-white">{{ group.name }}</h2>
                <p class="text-sm text-gray-400 mb-6">{{ group.description }}</p>
                <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                    {% for key in group['keys'] %}
                        <div class="space-y-1">
                            <label class="text-sm font-medium text-gray-200 block">{{ key | replace('_', ' ') | title }}</label>
                            <div class="text-xs text-gray-500 font-mono">{{ key }}</div>
                            <input type="text" name="{{ key }}" value="{{ settings[key] }}" class="w-full bg-dark-900 border border-dark-600 text-white rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition-all font-mono text-sm">
                        </div>
                    {% endfor %}
                </div>
            </section>
            {% endfor %}
        </form>
    </div>

    <script>
        async function refreshProfiles() {
            const profiles = await fetch('/api/profiles').then(r => r.json());
            const select = document.getElementById('profiles');
            select.innerHTML = '<option value="">Choose profile</option>' + profiles.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
        }
        async function saveProfile() {
            const name = document.getElementById('profileName').value.trim();
            if (!name) return showStatus('Enter profile name.', false);
            const response = await fetch('/api/profiles', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name})});
            if (!response.ok) return showStatus((await response.json()).detail || 'Profile save failed.', false);
            await refreshProfiles(); showStatus('Profile saved.', true);
        }
        async function applyProfile() {
            const id = document.getElementById('profiles').value;
            if (!id) return showStatus('Choose profile.', false);
            const response = await fetch(`/api/profiles/${id}/apply`, {method:'POST'});
            if (!response.ok) return showStatus('Profile apply failed.', false);
            localStorage.removeItem('strategySettingsDraft');
            location.reload();
        }
        async function deleteProfile() {
            const id = document.getElementById('profiles').value;
            if (!id) return showStatus('Choose profile.', false);
            await fetch(`/api/profiles/${id}`, {method:'DELETE'}); await refreshProfiles(); showStatus('Profile deleted.', true);
        }
        function showStatus(message, success) {
            const box = document.getElementById('statusAlert');
            box.textContent = message; box.className = `p-4 rounded-lg font-medium text-center ${success ? 'bg-profit/20 text-profit' : 'bg-loss/20 text-loss'}`;
        }
        async function saveSettings() {
            const form = document.getElementById('settingsForm');
            const formData = new FormData(form);
            const data = {};
            formData.forEach((value, key) => { data[key] = value; });
            localStorage.setItem('strategySettingsDraft', JSON.stringify(data));

            const alertBox = document.getElementById('statusAlert');
            alertBox.classList.remove('hidden', 'bg-profit/20', 'text-profit', 'bg-loss/20', 'text-loss');

            try {
                const response = await fetch('/api/settings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                if (result.status === 'success') {
                    alertBox.textContent = 'Settings saved successfully! They will take effect on the next scan cycle.';
                    alertBox.classList.add('bg-profit/20', 'text-profit');
                } else {
                    alertBox.textContent = 'Failed to save settings.';
                    alertBox.classList.add('bg-loss/20', 'text-loss');
                }
            } catch (error) {
                console.error('Error:', error);
                alertBox.textContent = 'Server connection error.';
                alertBox.classList.add('bg-loss/20', 'text-loss');
            }
        }
        function restoreSettingsDraft() {
            try {
                const draft = JSON.parse(localStorage.getItem('strategySettingsDraft') || '{}');
                Object.entries(draft).forEach(([key, value]) => {
                    const input = document.querySelector(`[name="${key}"]`);
                    if (input) input.value = value;
                });
            } catch (error) { console.warn('Could not restore settings draft', error); }
        }
        document.querySelectorAll('#settingsForm input').forEach(input => input.addEventListener('input', () => {
            const draft = JSON.parse(localStorage.getItem('strategySettingsDraft') || '{}');
            draft[input.name] = input.value;
            localStorage.setItem('strategySettingsDraft', JSON.stringify(draft));
        }));
        restoreSettingsDraft();
        refreshProfiles();
    </script>
</body>
</html>
